{% extends 'agendamentos/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm border-0 p-4 text-center" style="max-width: 450px; width: 100%;">
        

        <h3 class="fw-bold text-dark mb-2">Deseja mesmo sair?</h3>
        <p class="text-muted small mb-4">Você será desconectado da sua sessão atual no sistema da Ulbra.</p>

        <!-- Formulário de Logout (POST) -->
        <form method="post" action="{% url 'logout_customizado' %}">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 fw-semibold">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-danger px-4 fw-semibold" style="background-color: #b02a37; border-color: #b02a37;">
                    Sim, Sair
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
